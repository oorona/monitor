# monitor-gateway: independent UI/API and streaming MCP endpoint.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    client_max_body_size 1m;

    # Re-resolve the backend through Docker DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_forwarded_proto $upstream_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;

    server {
        listen 8080;

        location = /gateway-health {
            access_log off;
            return 200 "ok\n";
        }

        location /mcp {
            limit_req zone=mcp burst=40 nodelay;
            set $backend http://monitor-backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_proto;
            proxy_set_header X-Gateway-Request 1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            add_header X-Content-Type-Options nosniff always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        location / {
            set $frontend http://monitor-frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $upstream_proto;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
