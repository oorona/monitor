name: monitor
services:
  backend:
    build: ./backend
    user: 1000:1000
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ping_group_range: '0 2147483647'
    tmpfs: [/tmp]
    restart: unless-stopped
    environment:
      SUITE_REGISTRY_ROOT: /registry
      ORACLE_WALLET_ROOT: /wallets
      ORACLE_CLIENT_LIB_DIR: /opt/oracle/client/lib
      MONITOR_CONFIG_PATH: /config/servers.yaml
      MONITOR_SECRETS_PATH: /run/secrets
    volumes:
      - ./servers.yaml:/config/servers.yaml:ro
      - ./secrets:/run/secrets:ro
      - ${DATABASE_REGISTRY_HOST_PATH:?Set shared database registry directory}:/registry:ro
      - ${MONITOR_WALLET_HOST_PATH:?Set Oracle wallet directory}:/wallets:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    extra_hosts: ['host.docker.internal:host-gateway']
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:4000:3000']
    environment:
      MONITOR_API_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
